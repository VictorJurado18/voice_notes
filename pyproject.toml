[project]
name = "record-transcript-resume"
version = "0.10.29"
description = "Windows app to record audio locally, transcribe with Whisper, and summarize via Codex or Claude Code CLI."
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
    "lameenc>=1.8.2",
    "numpy>=1.24",
    "pyaudiowpatch>=0.2.12",
    "faster-whisper>=1.0",
    "av>=11,<19",  # faster-whisper 1.2.1 ainda usa metadata_errors, removido no PyAV 19
    "pillow>=10.0",
    "pystray>=0.19.5",
    "keyring>=25.7",
    "yt-dlp>=2025.8.22",
    "imageio-ffmpeg>=0.6.0",
    "pyannote.audio==4.0.7",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "Send2Trash[nativeLib]>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.11"]
gpu = [
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.27.0.42; sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12==12.9.86; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
record-transcript-resume = "record_transcript_resume.cli:main"
record-transcript-resume-gui = "record_transcript_resume.gui:main"
