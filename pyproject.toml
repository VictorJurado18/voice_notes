[project]
name = "gravador-audio"
version = "0.1.0"
description = "Aplicacao Windows para gravar audio local em MP3."
requires-python = ">=3.12"
dependencies = [
    "lameenc>=1.8.2",
    "soundcard>=0.4.6",
]

[project.scripts]
gravador-audio = "gravador_audio.cli:main"
gravador-audio-gui = "gravador_audio.gui:main"
